<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Von Digitalis Estates — System Architecture Stack</text>

  <!-- Legend -->
  <rect x="850" y="60" width="230" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="862" y="72" width="16" height="16" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="886" y="85" font-size="12" fill="#334155">Estate / edge layer</text>
  <rect x="862" y="94" width="16" height="16" fill="#dcfce7" stroke="#22c55e"/>
  <text x="886" y="107" font-size="12" fill="#334155">Cloud services</text>
  <rect x="862" y="116" width="16" height="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="886" y="129" font-size="12" fill="#334155">AI / model layer</text>

  <!-- Estate/edge layer -->
  <text x="60" y="90" font-size="14" font-weight="700" fill="#1e40af">ESTATE / EDGE LAYER</text>
  <rect x="60" y="100" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="126" text-anchor="middle" font-size="13" fill="#1e3a8a">Ride &amp; ticket-gate</text>
  <text x="150" y="142" text-anchor="middle" font-size="13" fill="#1e3a8a">sensors (40 rides)</text>

  <rect x="260" y="100" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="350" y="126" text-anchor="middle" font-size="13" fill="#1e3a8a">Enclosure sensors</text>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="#1e3a8a">(55 displays)</text>

  <rect x="460" y="100" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="550" y="126" text-anchor="middle" font-size="13" fill="#1e3a8a">Zone gateway devices</text>
  <text x="550" y="142" text-anchor="middle" font-size="13" fill="#1e3a8a">(MQTT, store-and-forward)</text>

  <rect x="660" y="100" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="750" y="126" text-anchor="middle" font-size="13" fill="#1e3a8a">BLE presence sensors</text>
  <text x="750" y="142" text-anchor="middle" font-size="13" fill="#1e3a8a">(selected zones)</text>

  <!-- arrows to gateway -->
  <line x1="150" y1="160" x2="530" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="160" x2="540" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="160" x2="550" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="160" x2="570" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ingestion -->
  <rect x="430" y="230" width="240" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="550" y="256" text-anchor="middle" font-size="13" fill="#1e3a8a">MQTT Broker</text>
  <text x="550" y="272" text-anchor="middle" font-size="13" fill="#1e3a8a">(TLS per-device auth)</text>
  <line x1="550" y1="290" x2="550" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cloud services layer -->
  <text x="60" y="320" font-size="14" font-weight="700" fill="#15803d">CLOUD SERVICES LAYER</text>
  <rect x="120" y="330" width="200" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="220" y="358" text-anchor="middle" font-size="13" fill="#14532d">Ingestion Service</text>
  <text x="220" y="374" text-anchor="middle" font-size="12" fill="#14532d">(events → bus)</text>

  <rect x="340" y="330" width="200" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="440" y="358" text-anchor="middle" font-size="13" fill="#14532d">Popularity Analytics</text>
  <text x="440" y="374" text-anchor="middle" font-size="12" fill="#14532d">(hourly / daily batch)</text>

  <rect x="560" y="330" width="200" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="660" y="358" text-anchor="middle" font-size="13" fill="#14532d">Animal Monitoring</text>
  <text x="660" y="374" text-anchor="middle" font-size="12" fill="#14532d">(anomaly service)</text>

  <rect x="780" y="330" width="200" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="880" y="358" text-anchor="middle" font-size="13" fill="#14532d">Ticketing Integration</text>
  <text x="880" y="374" text-anchor="middle" font-size="12" fill="#14532d">(SaaS webhook adapter)</text>

  <line x1="220" y1="290" x2="220" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" opacity="0"/>
  <line x1="550" y1="330" x2="220" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="330" x2="440" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="330" x2="660" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- AI layer -->
  <text x="60" y="470" font-size="14" font-weight="700" fill="#b45309">AI / MODEL LAYER</text>
  <rect x="120" y="480" width="220" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="230" y="508" text-anchor="middle" font-size="13" fill="#78350f">Anomaly detection</text>
  <text x="230" y="524" text-anchor="middle" font-size="12" fill="#78350f">(species-tiered models)</text>

  <rect x="360" y="480" width="220" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="470" y="508" text-anchor="middle" font-size="13" fill="#78350f">Vision counting</text>
  <text x="470" y="524" text-anchor="middle" font-size="12" fill="#78350f">(piranha population)</text>

  <rect x="600" y="480" width="220" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="710" y="508" text-anchor="middle" font-size="13" fill="#78350f">Model abstraction layer</text>
  <text x="710" y="524" text-anchor="middle" font-size="12" fill="#78350f">(provider-swappable)</text>

  <line x1="660" y1="400" x2="230" y2="480" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="400" x2="470" y2="480" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="550" x2="710" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="470" y1="550" x2="710" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Storage row -->
  <text x="60" y="620" font-size="14" font-weight="700" fill="#334155">DATA LAYER</text>
  <rect x="120" y="630" width="200" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="220" y="662" text-anchor="middle" font-size="13" fill="#1e293b">Time-series DB</text>
  <rect x="360" y="630" width="200" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="460" y="662" text-anchor="middle" font-size="13" fill="#1e293b">Relational DB</text>
  <rect x="600" y="630" width="200" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="700" y="662" text-anchor="middle" font-size="13" fill="#1e293b">Object storage (media)</text>

  <line x1="220" y1="550" x2="220" y2="630" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="400" x2="460" y2="630" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="470" y1="550" x2="700" y2="630" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
