<svg viewBox="0 0 1050 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1050" height="480" fill="#ffffff"/>
  <text x="525" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">UC02 — Animal Health &amp; Feeding Monitoring Data Flow</text>

  <rect x="30" y="80" width="180" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120" y="112" text-anchor="middle" font-size="13" fill="#1e3a8a">Weight / motion / feed</text>
  <text x="120" y="90" text-anchor="middle" font-size="0" fill="none"></text>
  <text x="120" y="127" text-anchor="middle" font-size="13" fill="#1e3a8a">sensors (LoRaWAN)</text>

  <rect x="30" y="170" width="180" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120" y="202" text-anchor="middle" font-size="13" fill="#1e3a8a">Keeper-logged</text>
  <text x="120" y="218" text-anchor="middle" font-size="13" fill="#1e3a8a">observations</text>

  <rect x="260" y="125" width="170" height="55" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="345" y="150" text-anchor="middle" font-size="13" fill="#1e293b">LoRaWAN gateway</text>
  <text x="345" y="166" text-anchor="middle" font-size="13" fill="#1e293b">(1 of 3, local thresholds)</text>
  <line x1="210" y1="107" x2="260" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="210" y1="197" x2="260" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- urgent local path -->
  <rect x="490" y="60" width="200" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="590" y="85" text-anchor="middle" font-size="13" fill="#7f1d1d">Local threshold breach</text>
  <text x="590" y="101" text-anchor="middle" font-size="13" fill="#7f1d1d">→ immediate alert</text>
  <line x1="430" y1="135" x2="490" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="440" y="120" font-size="11" fill="#64748b">urgent path</text>
  <text x="440" y="133" font-size="11" fill="#64748b">(works offline, ADR002)</text>

  <!-- normal cloud path -->
  <rect x="490" y="170" width="200" height="55" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="590" y="195" text-anchor="middle" font-size="13" fill="#14532d">Ingestion service</text>
  <text x="590" y="211" text-anchor="middle" font-size="13" fill="#14532d">(once connected)</text>
  <line x1="430" y1="160" x2="490" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="730" y="170" width="220" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="840" y="195" text-anchor="middle" font-size="13" fill="#78350f">Anomaly-detection model</text>
  <text x="840" y="211" text-anchor="middle" font-size="13" fill="#78350f">(species-tiered baseline)</text>
  <line x1="690" y1="197" x2="730" y2="197" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="730" y="270" width="220" height="60" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="840" y="295" text-anchor="middle" font-size="13" fill="#7f1d1d">High-confidence anomaly</text>
  <text x="840" y="311" text-anchor="middle" font-size="13" fill="#7f1d1d">→ keeper notification</text>
  <line x1="840" y1="225" x2="840" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="490" y="270" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="590" y="295" text-anchor="middle" font-size="13" fill="#1e293b">Low-confidence anomaly</text>
  <text x="590" y="311" text-anchor="middle" font-size="13" fill="#1e293b">→ logged only</text>
  <line x1="730" y1="300" x2="690" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#a4)"/>

  <circle cx="920" cy="400" r="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="920" y="408" text-anchor="middle" font-size="20">🧑‍🌾</text>
  <text x="920" y="440" text-anchor="middle" font-size="12" fill="#334155">Keeper confirms /</text>
  <text x="920" y="454" text-anchor="middle" font-size="12" fill="#334155">dismisses (ADR007)</text>
  <line x1="880" y1="330" x2="920" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <path d="M894,400 C 700,460 700,240 690,225" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#a4)"/>
  <text x="700" y="460" text-anchor="middle" font-size="11" fill="#64748b" transform="translate(0,-5)">true/false-positive label feeds tuning loop</text>
</svg>
