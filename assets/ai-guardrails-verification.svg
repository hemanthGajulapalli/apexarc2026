<svg viewBox="0 0 1050 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1050" height="560" fill="#ffffff"/>
  <text x="525" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AI Verification &amp; Guardrails (ADR007, ADR010, ADR011, ADR020)</text>

  <!-- Pre-deploy -->
  <rect x="40" y="70" width="290" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="185" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">BEFORE DEPLOYMENT</text>
  <rect x="60" y="110" width="250" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="185" y="137" text-anchor="middle" font-size="12" fill="#78350f">Golden-set regression suite</text>
  <rect x="60" y="165" width="250" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="185" y="192" text-anchor="middle" font-size="12" fill="#78350f">Hard blocker in CI/CD (ADR020)</text>
  <line x1="185" y1="155" x2="185" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)"/>

  <!-- Provider portability -->
  <rect x="380" y="70" width="290" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="525" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">PROVIDER RISK</text>
  <rect x="400" y="110" width="250" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="525" y="137" text-anchor="middle" font-size="12" fill="#78350f">Model abstraction layer (ADR010)</text>
  <rect x="400" y="165" width="250" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="525" y="187" text-anchor="middle" font-size="12" fill="#78350f">Open models for lower-stakes</text>
  <text x="525" y="201" text-anchor="middle" font-size="12" fill="#78350f">tasks where feasible</text>

  <!-- Production -->
  <rect x="720" y="70" width="290" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="865" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">IN PRODUCTION</text>
  <rect x="740" y="110" width="250" height="45" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="865" y="137" text-anchor="middle" font-size="12" fill="#7f1d1d">Statistical drift monitoring</text>
  <rect x="740" y="165" width="250" height="45" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="865" y="192" text-anchor="middle" font-size="12" fill="#7f1d1d">Human feedback capture</text>

  <line x1="330" y1="145" x2="380" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="670" y1="145" x2="720" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)"/>

  <!-- Alert tiering guardrail -->
  <text x="525" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">ALERT TIERING GUARDRAIL (ADR007) — applies to all animal-monitoring outputs</text>

  <rect x="140" y="300" width="220" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="250" y="325" text-anchor="middle" font-size="13" fill="#78350f">Model output +</text>
  <text x="250" y="341" text-anchor="middle" font-size="13" fill="#78350f">confidence score</text>

  <path d="M360,320 L470,300" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)" fill="none"/>
  <rect x="470" y="270" width="220" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="580" y="292" text-anchor="middle" font-size="13" fill="#1e293b">Low confidence</text>
  <text x="580" y="308" text-anchor="middle" font-size="13" fill="#1e293b">→ log only, no interrupt</text>

  <path d="M360,340 L470,365" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)" fill="none"/>
  <rect x="470" y="345" width="220" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="580" y="367" text-anchor="middle" font-size="13" fill="#7f1d1d">High confidence</text>
  <text x="580" y="383" text-anchor="middle" font-size="13" fill="#7f1d1d">→ notify keeper</text>

  <line x1="690" y1="372" x2="740" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#a6)"/>
  <circle cx="800" cy="372" r="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="800" y="380" text-anchor="middle" font-size="20">🧑‍🌾</text>
  <text x="800" y="412" text-anchor="middle" font-size="12" fill="#334155">Human confirms —</text>
  <text x="800" y="426" text-anchor="middle" font-size="12" fill="#334155">no automated action</text>

  <path d="M800,398 C 700,470 350,470 250,360" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#a6)"/>
  <text x="525" y="480" text-anchor="middle" font-size="12" fill="#64748b">Confirmed label feeds back into per-tier model tuning</text>

  <rect x="140" y="510" width="770" height="35" rx="6" fill="#eef2ff" stroke="#818cf8"/>
  <text x="525" y="533" text-anchor="middle" font-size="12" fill="#3730a3">Core guardrail: no AI output ever triggers an automated welfare/business action without human confirmation</text>
</svg>
