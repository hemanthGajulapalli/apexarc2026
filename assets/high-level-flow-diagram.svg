<svg viewBox="0 0 1150 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1150" height="500" fill="#ffffff"/>
  <text x="575" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">High-Level Flow — Visitor to Insight</text>

  <!-- Visitor -->
  <circle cx="70" cy="120" r="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="70" y="126" text-anchor="middle" font-size="22">🧑</text>
  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#334155">Visitor</text>

  <rect x="150" y="95" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="235" y="127" text-anchor="middle" font-size="13" fill="#1e3a8a">Buys ticket / pass</text>
  <line x1="96" y1="120" x2="150" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="235" y="165" text-anchor="middle" font-size="11" fill="#64748b">identity: OAuth/OIDC, not the ticketing SaaS (ADR016)</text>

  <rect x="360" y="95" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="445" y="120" text-anchor="middle" font-size="13" fill="#1e3a8a">Scans at rides /</text>
  <text x="445" y="136" text-anchor="middle" font-size="13" fill="#1e3a8a">enclosure gates</text>
  <line x1="320" y1="120" x2="360" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="570" y="95" width="170" height="55" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="655" y="120" text-anchor="middle" font-size="13" fill="#1e293b">LoRaWAN gateway</text>
  <text x="655" y="136" text-anchor="middle" font-size="13" fill="#1e293b">(1 of 3, MQTT buffered)</text>
  <line x1="530" y1="120" x2="570" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="780" y="95" width="170" height="55" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="865" y="127" text-anchor="middle" font-size="13" fill="#14532d">Popularity Analytics</text>
  <line x1="740" y1="120" x2="780" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="990" y="95" width="140" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1060" y="120" text-anchor="middle" font-size="13" fill="#1e293b">Ops dashboard</text>
  <text x="1060" y="136" text-anchor="middle" font-size="13" fill="#1e293b">(staffing)</text>
  <line x1="950" y1="120" x2="990" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Animal path -->
  <circle cx="70" cy="280" r="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="70" y="288" text-anchor="middle" font-size="20">🐟</text>
  <text x="70" y="320" text-anchor="middle" font-size="12" fill="#334155">Animals</text>

  <rect x="150" y="255" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="235" y="280" text-anchor="middle" font-size="13" fill="#1e3a8a">Sensors + keeper</text>
  <text x="235" y="296" text-anchor="middle" font-size="13" fill="#1e3a8a">observations</text>
  <line x1="96" y1="280" x2="150" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="360" y="255" width="170" height="55" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="445" y="280" text-anchor="middle" font-size="13" fill="#1e293b">LoRaWAN gateway</text>
  <text x="445" y="296" text-anchor="middle" font-size="13" fill="#1e293b">(1 of 3, local thresholds)</text>
  <line x1="320" y1="280" x2="360" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="570" y="255" width="170" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="655" y="280" text-anchor="middle" font-size="13" fill="#78350f">Anomaly detection</text>
  <text x="655" y="296" text-anchor="middle" font-size="13" fill="#78350f">(species-tiered model)</text>
  <line x1="530" y1="280" x2="570" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="780" y="255" width="170" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="865" y="280" text-anchor="middle" font-size="13" fill="#7f1d1d">High-confidence</text>
  <text x="865" y="296" text-anchor="middle" font-size="13" fill="#7f1d1d">alert → keeper</text>
  <line x1="740" y1="280" x2="780" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <circle cx="1060" cy="282" r="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1060" y="290" text-anchor="middle" font-size="20">🧑‍🌾</text>
  <text x="1060" y="320" text-anchor="middle" font-size="12" fill="#334155">Keeper confirms</text>
  <line x1="950" y1="280" x2="1030" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M865,310 C865,360 655,360 655,310" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow2)"/>
  <text x="760" y="378" text-anchor="middle" font-size="11" fill="#64748b">feedback tunes model (ADR007)</text>

  <!-- Piranha branch -->
  <rect x="360" y="400" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="445" y="424" text-anchor="middle" font-size="13" fill="#1e3a8a">Scheduled photo/video</text>
  <text x="445" y="440" text-anchor="middle" font-size="13" fill="#1e3a8a">capture (piranhas)</text>

  <rect x="570" y="400" width="170" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="655" y="424" text-anchor="middle" font-size="13" fill="#78350f">Vision model</text>
  <text x="655" y="440" text-anchor="middle" font-size="13" fill="#78350f">population count</text>
  <line x1="530" y1="427" x2="570" y2="427" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="780" y="400" width="170" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="865" y="424" text-anchor="middle" font-size="13" fill="#7f1d1d">Decline flagged</text>
  <text x="865" y="440" text-anchor="middle" font-size="13" fill="#7f1d1d">→ keeper review</text>
  <line x1="740" y1="427" x2="780" y2="427" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="235" y="435" text-anchor="middle" font-size="12" fill="#64748b">(part of animal</text>
  <text x="235" y="450" text-anchor="middle" font-size="12" fill="#64748b">monitoring tier — UC03)</text>
</svg>
