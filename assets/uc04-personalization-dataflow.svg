<text x="135.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#1e3a8a">purchase (ADR009)</text>
<rect x="280" y="105" width="190" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="375.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Loyalty enrollment</text>
<text x="375.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#1e3a8a">(non-AI, ADR008)</text>
<rect x="520" y="105" width="220" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="630.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#14532d">Return visit: discount /</text>
<text x="630.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#14532d">loyalty card auto-applied</text>
<line x1="230" y1="135" x2="280" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#a5)"/>
<line x1="470" y1="135" x2="520" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#a5)"/>
<line x1="20" y1="190" x2="1030" y2="190" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="50" y="225" font-size="14" font-weight="700" fill="#78350f">PHASE TWO (future, AI-assisted - gated on data volume, ADR008)</text>
<rect x="40" y="240" width="190" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="5,4"/>
<text x="135.0" y="259.0" text-anchor="middle" font-size="12.5" fill="#78350f">Visitor returns,</text>
<text x="135.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#78350f">authenticates (OAuth,</text>
<text x="135.0" y="291.0" text-anchor="middle" font-size="12.5" fill="#78350f">ADR016)</text>
<rect x="280" y="240" width="210" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="5,4"/>
<text x="385.0" y="259.0" text-anchor="middle" font-size="12.5" fill="#78350f">Query popularity (UC01) +</text>
<text x="385.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#78350f">ticketing history for</text>
<text x="385.0" y="291.0" text-anchor="middle" font-size="12.5" fill="#78350f">this visitor</text>
<rect x="540" y="240" width="210" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="5,4"/>
<text x="645.0" y="259.0" text-anchor="middle" font-size="12.5" fill="#78350f">Recommendation model</text>
<text x="645.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#78350f">(ADR010 abstraction,</text>
<text x="645.0" y="291.0" text-anchor="middle" font-size="12.5" fill="#78350f">ADR011 verified)</text>
<rect x="800" y="240" width="210" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="5,4"/>
<text x="905.0" y="259.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Personalized itinerary /</text>
<text x="905.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">targeted return offer</text>
<text x="905.0" y="291.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">surfaced to visitor</text>
<line x1="230" y1="275" x2="280" y2="275" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a5)"/>
<line x1="490" y1="275" x2="540" y2="275" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a5)"/>
<line x1="750" y1="275" x2="800" y2="275" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a5)"/>
<rect x="540" y="360" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="650.0" y="382.0" text-anchor="middle" font-size="12.5" fill="#1e293b">Engagement feedback</text>
<text x="650.0" y="398.0" text-anchor="middle" font-size="12.5" fill="#1e293b">captured (click / booking)</text>
<line x1="863.0" y1="310" x2="694.0" y2="360" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a5)"/>
<path d="M540,390 C 500,390 500,275 540,275" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#a5)"/>
<text x="445" y="330" text-anchor="middle" font-size="10.5" fill="#64748b">feeds model refinement</text>
<text x="445" y="343" text-anchor="middle" font-size="10.5" fill="#64748b">(ADR011)</text>
<text x="525.0" y="450" text-anchor="middle" font-size="12" fill="#64748b">Gate: Phase Two development does not begin until an agreed ticketing/popularity data volume threshold is met (ADR008)</text>
<text x="525.0" y="470" text-anchor="middle" font-size="12" fill="#64748b">Privacy: visitor may opt out of personalization and falls back to Phase One loyalty only (ADR018)</text>
</svg>
