<svg viewBox="0 0 1050 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1050" height="500" fill="#ffffff"/>
<text x="525.0" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">UC04 - Returning Visitor Personalization Data Flow</text>
<text x="50" y="90" font-size="14" font-weight="700" fill="#1e40af">PHASE ONE (live at launch, no AI)</text>
