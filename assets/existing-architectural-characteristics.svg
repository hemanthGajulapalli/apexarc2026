<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Architectural Characteristics</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#64748b">Do the AI additions match the existing (pre-AI) system's priorities?</text>

  <!-- header -->
  <rect x="40" y="90" width="380" height="36" fill="#f1f5f9"/>
  <text x="230" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CHARACTERISTIC</text>
  <rect x="420" y="90" width="220" height="36" fill="#dbeafe"/>
  <text x="530" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">BASE SYSTEM PRIORITY</text>
  <rect x="640" y="90" width="220" height="36" fill="#fef3c7"/>
  <text x="750" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">AI ADDITIONS</text>

  <!-- rows -->
  <!-- helper: 5-dot scale -->
  <!-- Row 1: Reliability -->
  <rect x="40" y="126" width="380" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="150" font-size="13" fill="#0f172a" font-weight="700">Reliability</text>
  <text x="56" y="168" font-size="11" fill="#64748b">Ticketing/payments must not fail</text>
  <rect x="420" y="126" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <g transform="translate(500,156)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="36" cy="0" r="6" fill="#3b82f6"/><circle cx="54" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="72" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  <rect x="640" y="126" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="656" y="150" font-size="11" fill="#78350f">Matched — human confirms</text>
  <text x="656" y="164" font-size="11" fill="#78350f">before any AI-driven action</text>
  <text x="656" y="178" font-size="11" fill="#78350f">(ADR007)</text>

  <!-- Row 2: Availability -->
  <rect x="40" y="186" width="380" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="210" font-size="13" fill="#0f172a" font-weight="700">Availability</text>
  <text x="56" y="228" font-size="11" fill="#64748b">Patchy WiFi is a known constraint</text>
  <rect x="420" y="186" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <g transform="translate(500,216)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="36" cy="0" r="6" fill="#3b82f6"/><circle cx="54" cy="0" r="6" fill="#cbd5e1"/>
    <circle cx="72" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  <rect x="640" y="186" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="210" font-size="11" fill="#78350f">Matched — local threshold</text>
  <text x="656" y="224" font-size="11" fill="#78350f">alerting keeps working offline</text>
  <text x="656" y="238" font-size="11" fill="#78350f">(ADR002)</text>

  <!-- Row 3: Cost efficiency -->
  <rect x="40" y="246" width="380" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="270" font-size="13" fill="#0f172a" font-weight="700">Cost Efficiency</text>
  <text x="56" y="288" font-size="11" fill="#64748b">Budget-conscious estate, modest scale</text>
  <rect x="420" y="246" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <g transform="translate(500,276)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="36" cy="0" r="6" fill="#3b82f6"/><circle cx="54" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="72" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  <rect x="640" y="246" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="656" y="270" font-size="11" fill="#78350f">Matched — tiered/periodic</text>
  <text x="656" y="284" font-size="11" fill="#78350f">approaches over bespoke-per-</text>
  <text x="656" y="298" font-size="11" fill="#78350f">enclosure builds (ADR005, ADR006)</text>

  <!-- Row 4: Auditability/governance -->
  <rect x="40" y="306" width="380" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="330" font-size="13" fill="#0f172a" font-weight="700">Auditability</text>
  <text x="56" y="348" font-size="11" fill="#64748b">Financial/ticketing records need audit trail</text>
  <rect x="420" y="306" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <g transform="translate(500,336)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="36" cy="0" r="6" fill="#3b82f6"/><circle cx="54" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="72" cy="0" r="6" fill="#3b82f6"/>
  </g>
  <rect x="640" y="306" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="330" font-size="11" fill="#78350f">Extended — golden-set +</text>
  <text x="656" y="344" font-size="11" fill="#78350f">keeper feedback labels create</text>
  <text x="656" y="358" font-size="11" fill="#78350f">an AI decision trail (ADR011)</text>

  <!-- Row 5: Elasticity -->
  <rect x="40" y="366" width="380" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="390" font-size="13" fill="#0f172a" font-weight="700">Elasticity</text>
  <text x="56" y="408" font-size="11" fill="#64748b">3x visitor growth target over 3 years</text>
  <rect x="420" y="366" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <g transform="translate(500,396)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="36" cy="0" r="6" fill="#3b82f6"/><circle cx="54" cy="0" r="6" fill="#cbd5e1"/>
    <circle cx="72" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  <rect x="640" y="366" width="220" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="656" y="390" font-size="11" fill="#78350f">Matched — serverless/managed</text>
  <text x="656" y="404" font-size="11" fill="#78350f">cloud services scale with</text>
  <text x="656" y="418" font-size="11" fill="#78350f">visitor volume (ADR013)</text>

  <!-- Row 6: Adaptability -->
  <rect x="40" y="426" width="380" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="450" font-size="13" fill="#0f172a" font-weight="700">Adaptability</text>
  <text x="56" y="468" font-size="11" fill="#64748b">Estate historically slow-changing</text>
  <rect x="420" y="426" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <g transform="translate(500,456)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><circle cx="18" cy="0" r="6" fill="#cbd5e1"/>
    <circle cx="36" cy="0" r="6" fill="#cbd5e1"/><circle cx="54" cy="0" r="6" fill="#cbd5e1"/>
    <circle cx="72" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  <rect x="640" y="426" width="220" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="450" font-size="11" fill="#78350f">Increased — provider</text>
  <text x="656" y="464" font-size="11" fill="#78350f">abstraction layer added</text>
  <text x="656" y="478" font-size="11" fill="#78350f">deliberately (ADR010)</text>

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#64748b">● scale: low ○ — high ●●●●●   |   Rows show where AI additions preserve, extend, or intentionally raise a characteristic</text>
  <text x="450" y="545" text-anchor="middle" font-size="12" fill="#64748b">beyond what the base (pre-AI) system required — most notably auditability and adaptability.</text>
</svg>
