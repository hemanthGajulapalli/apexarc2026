<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Visitor Growth Target</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">5,000/day today → 15,000/day within 3 years</text>

  <!-- axes -->
  <line x1="80" y1="420" x2="850" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="80" y2="420" stroke="#334155" stroke-width="1.5"/>

  <!-- gridlines + labels -->
  <line x1="80" y1="420" x2="850" y2="420" stroke="#e2e8f0"/>
  <line x1="80" y1="310" x2="850" y2="310" stroke="#e2e8f0"/>
  <line x1="80" y1="200" x2="850" y2="200" stroke="#e2e8f0"/>
  <line x1="80" y1="90" x2="850" y2="90" stroke="#e2e8f0"/>
  <text x="70" y="424" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="70" y="314" text-anchor="end" font-size="11" fill="#64748b">5,000</text>
  <text x="70" y="204" text-anchor="end" font-size="11" fill="#64748b">10,000</text>
  <text x="70" y="94" text-anchor="end" font-size="11" fill="#64748b">15,000</text>

  <!-- x labels -->
  <text x="150" y="440" text-anchor="middle" font-size="12" fill="#334155">Today</text>
  <text x="380" y="440" text-anchor="middle" font-size="12" fill="#334155">Year 1</text>
  <text x="610" y="440" text-anchor="middle" font-size="12" fill="#334155">Year 2</text>
  <text x="800" y="440" text-anchor="middle" font-size="12" fill="#334155">Year 3</text>

  <!-- target line dashed -->
  <line x1="80" y1="90" x2="850" y2="90" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="855" y="94" font-size="11" fill="#ef4444">Target: 15,000/day</text>

  <!-- growth curve -->
  <polyline points="150,310 380,255 610,175 800,100" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="150" cy="310" r="6" fill="#3b82f6"/>
  <circle cx="380" cy="255" r="6" fill="#3b82f6"/>
  <circle cx="610" cy="175" r="6" fill="#3b82f6"/>
  <circle cx="800" cy="100" r="6" fill="#3b82f6"/>

  <text x="150" y="295" text-anchor="middle" font-size="11" fill="#1e3a8a">5,000</text>
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#1e3a8a">~7,800</text>
  <text x="610" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">~11,600</text>
  <text x="800" y="85" text-anchor="middle" font-size="11" fill="#1e3a8a">15,000</text>

  <!-- driver callouts -->
  <rect x="330" y="330" width="120" height="60" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="390" y="352" text-anchor="middle" font-size="10" fill="#14532d">Popularity analytics</text>
  <text x="390" y="366" text-anchor="middle" font-size="10" fill="#14532d">(UC01) informs staffing</text>
  <line x1="390" y1="330" x2="390" y2="260" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="560" y="330" width="140" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="630" y="352" text-anchor="middle" font-size="10" fill="#78350f">Healthy, well-monitored</text>
  <text x="630" y="366" text-anchor="middle" font-size="10" fill="#78350f">animal collection (UC02/03)</text>
  <line x1="630" y1="330" x2="620" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="720" y="330" width="140" height="60" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="790" y="352" text-anchor="middle" font-size="10" fill="#7f1d1d">Returning-visitor</text>
  <text x="790" y="366" text-anchor="middle" font-size="10" fill="#7f1d1d">personalization (UC04)</text>
  <line x1="790" y1="330" x2="800" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
