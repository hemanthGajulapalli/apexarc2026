<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Test Approach — Two Tracks, One Confidence Model</text>

  <!-- column headers -->
  <text x="270" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">DETERMINISTIC COMPONENTS</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#64748b">ticketing · ingestion · gateways · dashboards</text>

  <text x="830" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">AI / NON-DETERMINISTIC COMPONENTS</text>
  <text x="830" y="88" text-anchor="middle" font-size="11" fill="#64748b">anomaly detection · vision counting · (future) recommendations</text>

  <!-- Deterministic pyramid (built from stacked trapezoids, widest at bottom) -->
  <!-- Level 1: Unit (bottom, widest) -->
  <polygon points="80,300 460,300 430,340 110,340" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="270" y="324" text-anchor="middle" font-size="13" fill="#1e3a8a">Unit tests</text>

  <!-- Level 2: Integration/contract -->
  <polygon points="110,260 430,260 405,300 135,300" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="270" y="284" text-anchor="middle" font-size="13" fill="#1e3a8a">Integration &amp; contract tests</text>

  <!-- Level 3: E2E -->
  <polygon points="135,220 405,220 380,260 160,260" fill="#93c5fd" stroke="#3b82f6"/>
  <text x="270" y="244" text-anchor="middle" font-size="13" fill="#1e3a8a">End-to-end tests</text>

  <!-- Level 4: Manual/UAT -->
  <polygon points="160,180 380,180 355,220 185,220" fill="#60a5fa" stroke="#3b82f6"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" fill="#eff6ff">Staff UAT</text>

  <!-- pyramid base label -->
  <text x="270" y="365" text-anchor="middle" font-size="11" fill="#64748b">grows narrower, slower, more expensive going up</text>

  <!-- AI verification stack (parallel, non-pyramid shape - stacked layers) -->
  <rect x="640" y="180" width="380" height="45" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="830" y="207" text-anchor="middle" font-size="13" fill="#78350f">Golden-set regression (hard CI/CD gate, ADR020)</text>

  <rect x="640" y="235" width="380" height="45" rx="6" fill="#fcd34d" stroke="#f59e0b"/>
  <text x="830" y="262" text-anchor="middle" font-size="13" fill="#78350f">Shadow / canary eval (high-stakes changes)</text>

  <rect x="640" y="290" width="380" height="45" rx="6" fill="#fbbf24" stroke="#f59e0b"/>
  <text x="830" y="317" text-anchor="middle" font-size="13" fill="#78350f">Statistical drift monitoring (continuous, in prod)</text>

  <rect x="640" y="345" width="380" height="45" rx="6" fill="#f59e0b" stroke="#b45309"/>
  <text x="830" y="372" text-anchor="middle" font-size="13" fill="#fffbeb">Human feedback capture (keeper labels)</text>

  <text x="830" y="405" text-anchor="middle" font-size="11" fill="#64748b">deploy-time gate → ongoing production signal</text>

  <!-- convergence into shared observability -->
  <line x1="270" y1="180" x2="500" y2="440" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="830" y1="180" x2="600" y2="440" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <rect x="400" y="440" width="300" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="550" y="463" text-anchor="middle" font-size="13" fill="#1e293b">Shared observability stack</text>
  <text x="550" y="479" text-anchor="middle" font-size="12" fill="#1e293b">(ADR017) — one place to look</text>

  <!-- cross-cutting non-functional band -->
  <rect x="60" y="530" width="980" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="550" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">CROSS-CUTTING NON-FUNCTIONAL TESTS (apply to both tracks)</text>
  <text x="180" y="582" text-anchor="middle" font-size="12" fill="#334155">Load / performance</text>
  <text x="380" y="582" text-anchor="middle" font-size="12" fill="#334155">Resilience / chaos</text>
  <text x="580" y="582" text-anchor="middle" font-size="12" fill="#334155">(WiFi outage sim.)</text>
  <text x="780" y="582" text-anchor="middle" font-size="12" fill="#334155">Security (device certs, RBAC)</text>
  <text x="950" y="582" text-anchor="middle" font-size="12" fill="#334155">DR restore drills</text>
  <text x="550" y="607" text-anchor="middle" font-size="11" fill="#64748b">Scaled to the 15,000 visitors/day growth target, not just current ~5,000/day load</text>

  <!-- ownership row -->
  <rect x="60" y="640" width="980" height="100" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="550" y="663" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">TEST OWNERSHIP</text>
  <text x="200" y="690" text-anchor="middle" font-size="12" fill="#3730a3">Engineering</text>
  <text x="200" y="706" text-anchor="middle" font-size="11" fill="#4338ca">unit/integration/e2e/golden-set/NFTs</text>

  <text x="480" y="690" text-anchor="middle" font-size="12" fill="#3730a3">Keeper / animal welfare staff</text>
  <text x="480" y="706" text-anchor="middle" font-size="11" fill="#4338ca">alert UAT, false-positive review (ADR007)</text>

  <text x="750" y="690" text-anchor="middle" font-size="12" fill="#3730a3">Operations staff</text>
  <text x="750" y="706" text-anchor="middle" font-size="11" fill="#4338ca">popularity accuracy spot-checks</text>

  <text x="960" y="690" text-anchor="middle" font-size="12" fill="#3730a3">Security</text>
  <text x="960" y="706" text-anchor="middle" font-size="11" fill="#4338ca">periodic pen testing</text>
</svg>
