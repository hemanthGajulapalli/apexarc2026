  <text x="860" y="208" text-anchor="middle" font-size="11" fill="#7f1d1d">AI personalization</text>
  <text x="860" y="230" text-anchor="middle" font-size="11" fill="#7f1d1d">(UC04, after 1 season</text>
  <text x="860" y="246" text-anchor="middle" font-size="11" fill="#7f1d1d">of visitor data)</text>

  <line x1="1020" y1="90" x2="1050" y2="90" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="1000" y="308" text-anchor="middle" font-size="12" fill="#64748b" transform="translate(0,0)"></text>

  <text x="550" y="320" text-anchor="middle" font-size="12" fill="#64748b">Each phase gated by: pilot validation → keeper/staff sign-off → incremental expansion (per ADR005, ADR007, ADR008 advice)</text>
  <text x="550" y="345" text-anchor="middle" font-size="12" fill="#64748b">Target: grow from ~5,000 to 15,000 visitors/day within 3 years while phases 0-3 progressively de-risk each AI investment</text>
