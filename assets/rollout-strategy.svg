<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="420" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Rollout Strategy</text>

  <line x1="80" y1="90" x2="1020" y2="90" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Phase 0 -->
  <circle cx="140" cy="90" r="9" fill="#3b82f6"/>
  <text x="140" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Phase 0</text>
  <rect x="50" y="110" width="180" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="140" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Foundations</text>
  <text x="140" y="154" text-anchor="middle" font-size="11" fill="#1e3a8a">Ticketing SaaS live</text>
  <text x="140" y="172" text-anchor="middle" font-size="11" fill="#1e3a8a">Zone gateways +</text>
  <text x="140" y="188" text-anchor="middle" font-size="11" fill="#1e3a8a">MQTT ingestion</text>
  <text x="140" y="206" text-anchor="middle" font-size="11" fill="#1e3a8a">Observability stack</text>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#1e3a8a">Simple loyalty</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#1e3a8a">mechanism</text>

  <!-- Phase 1 -->
  <circle cx="380" cy="90" r="9" fill="#22c55e"/>
  <text x="380" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Phase 1</text>
  <rect x="290" y="110" width="180" height="150" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="380" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Popularity Analytics</text>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#14532d">Ticket-gate scan</text>
  <text x="380" y="170" text-anchor="middle" font-size="11" fill="#14532d">popularity signal live</text>
  <text x="380" y="192" text-anchor="middle" font-size="11" fill="#14532d">Hourly/daily batch</text>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#14532d">Ops dashboard for</text>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#14532d">staffing decisions</text>

  <!-- Phase 2 -->
  <circle cx="620" cy="90" r="9" fill="#f59e0b"/>
  <text x="620" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Phase 2</text>
  <rect x="530" y="110" width="180" height="170" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="620" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Animal Monitoring</text>
  <text x="620" y="154" text-anchor="middle" font-size="11" fill="#78350f">2-3 highest-value</text>
  <text x="620" y="170" text-anchor="middle" font-size="11" fill="#78350f">tiers piloted first</text>
  <text x="620" y="192" text-anchor="middle" font-size="11" fill="#78350f">Local threshold +</text>
  <text x="620" y="208" text-anchor="middle" font-size="11" fill="#78350f">cloud anomaly model</text>
  <text x="620" y="230" text-anchor="middle" font-size="11" fill="#78350f">Piranha population</text>
  <text x="620" y="246" text-anchor="middle" font-size="11" fill="#78350f">counting live</text>

  <!-- Phase 3 -->
  <circle cx="860" cy="90" r="9" fill="#ef4444"/>
  <text x="860" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Phase 3</text>
  <rect x="770" y="110" width="180" height="170" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="860" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Scale &amp; Personalize</text>
  <text x="860" y="154" text-anchor="middle" font-size="11" fill="#7f1d1d">Expand tiers to all</text>
